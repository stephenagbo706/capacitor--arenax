<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>ArenaX</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/ax-ui/arenax-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;background:#04071b;color:#f3f6ff;font-family:Arial,sans-serif;text-align:center;padding:24px;">
      <div>
        <strong style="display:block;font-size:24px;margin-bottom:8px;">ArenaX is loading</strong>
        <span style="font-size:14px;color:#b8c7ff;">Starting the mobile app...</span>
      </div>
    </div>
  </app-root>
  <script>
    window.addEventListener('error', function (event) {
      console.error('[ArenaX startup error]', event.message, event.filename, event.lineno, event.colno, event.error && event.error.stack);
    });
    window.addEventListener('unhandledrejection', function (event) {
      console.error('[ArenaX startup rejection]', event.reason && (event.reason.stack || event.reason.message || event.reason));
    });
  </script>
</body>

</html>
